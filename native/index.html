<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма входа</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./index.js" defer></script>
  </head>
  
  <body>
    <header class="header">
      <button id="theme-toggle" class="button-theme">
        <img src="public/icons/weather-night.svg" class="button-icon" alt="">
      </button>
    </header>

    <main class="main">
      <section class="card">
        <h1 class="card-header">С возвращением!</h1>

        <form class="form" id="login-form">

          <label for="email">Электронная почта</label>
          <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

          <div class="password">
            <label for="password">Пароль</label>
            <div class="password-view">
              <input type="password" id="password" name="password" placeholder="Введите пароль" required>
              <button type="button" class="button-password">
                <img src="public/icons/eye.svg" class="button-icon">
              </button>
            </div>
          </div>
          

          <div class="checkbox">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Запомнить меня</label>
          </div>

          <button type="submit" class="button-login">Войти</button>

        </form>

        <p class="divider">или</p>

        <ul class="socials">
          <li>
            <button type="button" class="button-socials" id="google-button">
              <img src="public/icons/google-icon.svg" class="button-icon" draggable="false" alt="google-icon">
              Войти через Google
            </button>
          </li>

          <li>
            <button type="button" class="button-socials" id="apple-button">
              <img src="public/icons/apple-icon.svg" class="button-icon" draggable="false" alt="apple-icon">
              Войти через Apple
            </button>
          </li>
        </ul>

        <p class="divider">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
        
      </section>
    </main>
    <footer class="footer">Подвал</footer>
  </body>

</html>
